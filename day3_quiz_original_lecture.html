<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day3 강의 원본 내용 퀴즈</title>
<style>
  :root {
    --accent: #378ADD;
    --success-bg: #EAF3DE;
    --success-text: #27500A;
    --success-border: #639922;
    --danger-bg: #FCEBEB;
    --danger-text: #791F1F;
    --danger-border: #E24B4A;
    --surface: #F4F4F4;
    --text-secondary: #6B6B6B;
    --border: #E0E0E0;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
    color: #222;
    background: #fff;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }
  #progress { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
  #bar-outer { height: 6px; background: var(--surface); border-radius: 6px; margin-bottom: 1.5rem; overflow: hidden; }
  #bar { height: 100%; background: var(--accent); width: 0%; transition: width .25s; }
  .question { font-size: 16px; font-weight: 600; margin: 0 0 1.1rem; line-height: 1.5; }
  button.opt {
    display: block; width: 100%; text-align: left; padding: 13px 15px; margin-bottom: 9px;
    font-size: 14.5px; line-height: 1.5; border: 1.5px solid var(--border); border-radius: var(--radius);
    background: #fff; cursor: pointer; transition: all .15s; color: #222;
  }
  button.opt:hover:not(:disabled) { border-color: var(--accent); }
  button.opt:disabled { cursor: default; }
  #fb { display: none; margin-top: 14px; padding: 14px 16px; border-radius: var(--radius); font-size: 13.5px; line-height: 1.65; }
  #next {
    display: none; margin-top: 14px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
    border: none; border-radius: var(--radius); background: var(--accent); color: #fff; cursor: pointer;
  }
  #next:hover { opacity: 0.9; }
  #result { display: none; text-align: center; padding: 3rem 0; }
  #result .score { font-size: 28px; font-weight: 700; margin: 0 0 6px; }
  #result .pct { font-size: 14px; color: var(--text-secondary); margin: 0 0 2rem; }
  #retry {
    padding: 12px 28px; font-size: 15px; font-weight: 600; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff; cursor: pointer;
  }
</style>
</head>
<body>

<h1>📊 Day3 강의 원본 내용 퀴즈</h1>
<p class="subtitle">워드임베딩 · RNN/LSTM · Seq2Seq/Attention · Transformer · 사전학습 언어모델 — 12문항</p>

<div id="progress"></div>
<div id="bar-outer"><div id="bar"></div></div>
<div id="qbox"></div>
<div id="result"></div>

<script>
const Q = [{"q": "원-핫 인코딩의 가장 치명적인 한계는?", "opts": ["의미가 비슷한 단어끼리도 벡터상에서 완전히 무관해진다", "항상 저차원 벡터가 된다", "단어 사전을 만들 필요가 없다", "계산 속도가 너무 빠르다"], "a": 0, "e": "원-핫 벡터는 그 번호 자리만 1이고 나머지는 0이라, '은행'과 '금융'처럼 의미가 비슷한 단어라도 벡터상으로는 완전히 무관한 사이가 됩니다. 또한 단어 수가 많아질수록 벡터가 매우 길어집니다."}, {"q": "Word2Vec의 Skip-gram 방식은 무엇을 예측하나요?", "opts": ["문장 전체의 감정을 예측", "다음 문장이 이어지는지 예측", "주변 단어들을 보고 중심 단어를 예측", "중심 단어를 보고 주변 단어들을 예측"], "a": 3, "e": "Skip-gram은 중심 단어를 입력으로 주고 주변 단어들을 맞추는 방식입니다. 반대로 주변 단어들을 보고 중심 단어를 맞추는 방식은 CBOW입니다."}, {"q": "RNN이 문장이 길어질수록 겪는 대표적인 문제는?", "opts": ["차원의 저주", "다중공선성", "과적합", "기울기 소실(Vanishing Gradient)로 먼 과거를 잊는 현상"], "a": 3, "e": "역전파 과정에서 작은 값들이 계속 곱해지면서 과거로 갈수록 기울기가 점점 작아져 거의 0에 가까워지는 기울기 소실 문제가 발생해, RNN은 먼 과거의 정보를 사실상 학습하지 못합니다."}, {"q": "LSTM이 RNN과 달리 추가로 갖는 요소는?", "opts": ["Positional Encoding", "Beam Search", "cell state와 Forget/Input/Output 3개의 게이트", "Batch Normalization"], "a": 2, "e": "LSTM은 hidden state 외에 cell state라는 장기 기억장을 따로 두고, Forget/Input/Output 3개의 게이트로 이 기억장에서 무엇을 버리고 넣고 출력할지 관리합니다."}, {"q": "Seq2Seq 모델에서 Attention이 해결하는 핵심 문제는?", "opts": ["vocab 크기가 너무 큰 문제", "학습 속도가 느린 문제", "인코더가 문장 전체를 벡터 하나로만 요약해 정보가 손실되는 병목현상", "출력 문장의 길이가 고정되는 문제"], "a": 2, "e": "Seq2Seq는 아무리 긴 문장이라도 인코더가 단 하나의 벡터로 요약해야 해서 정보 손실(병목현상)이 발생합니다. Attention은 디코더가 인코더의 모든 hidden state를 직접 참조하게 해 이를 해결합니다."}, {"q": "Attention 계산 3단계의 올바른 순서는?", "opts": ["유사도 점수 계산 → softmax로 확률화 → 가중합으로 context vector 생성", "가중합 → 유사도 점수 계산 → softmax", "가중합 → softmax → 유사도 점수 계산", "softmax → 가중합 → 유사도 점수 계산"], "a": 0, "e": "Query와 각 Value 사이의 유사도(score)를 구한 뒤, 이를 softmax로 확률분포로 바꾸고, 그 확률로 각 Value를 가중평균해 context vector를 만드는 순서입니다."}, {"q": "Self-Attention이 원래 가진 3가지 한계가 아닌 것은?", "opts": ["계산 비용이 항상 RNN보다 크다는 문제", "미래 참조 문제", "비선형성 부족", "순서 정보 부재"], "a": 0, "e": "Self-Attention의 3가지 한계는 순서 정보 부재, 비선형성 부족, 미래 참조 문제입니다. Transformer는 이를 각각 Positional Encoding, Feed-Forward Network, Masked Self-Attention으로 해결합니다."}, {"q": "Transformer에서 Scaled Dot-Product의 '스케일링(차원의 제곱근으로 나누기)'을 하는 이유는?", "opts": ["메모리 사용량을 줄이기 위해", "벡터 차원이 커질수록 내적값이 커져 softmax가 한쪽으로 치우치는 것을 막기 위해", "계산 속도를 높이기 위해", "Positional Encoding을 대체하기 위해"], "a": 1, "e": "벡터의 차원이 크면 내적값도 커져 softmax 출력이 지나치게 한쪽으로 쏠릴 수 있습니다. 차원의 제곱근으로 나눠 값을 안정적인 범위로 조절합니다."}, {"q": "BERT, T5, GPT의 구조적 차이를 올바르게 짝지은 것은?", "opts": ["BERT=Decoder, T5=Encoder, GPT=Encoder-Decoder", "BERT=Encoder, T5=Encoder-Decoder, GPT=Decoder", "셋 다 Encoder만 사용", "셋 다 Decoder만 사용"], "a": 1, "e": "BERT는 Transformer의 Encoder만, T5는 Encoder-Decoder를 모두, GPT는 Decoder만 사용합니다. BERT는 빈칸 채우기, T5는 텍스트→텍스트 변환, GPT는 다음 단어 예측으로 학습합니다."}, {"q": "BERT의 Masked Language Modeling(MLM)에서 마스킹 토큰의 15% 중 일부를 [MASK]가 아닌 랜덤 토큰이나 원래 단어로도 치환하는 이유는?", "opts": ["Next Sentence Prediction과의 충돌을 막기 위해", "모델이 [MASK] 토큰에만 의존하지 않고 다양한 문맥을 학습해 더 견고해지도록 하기 위해", "학습 속도를 높이기 위해", "vocab 크기를 줄이기 위해"], "a": 1, "e": "만약 항상 [MASK]로만 치환하면 실제 추론(파인튜닝) 시에는 [MASK] 토큰이 없어 학습-추론 간 불일치가 생깁니다. 일부를 랜덤 토큰이나 원래 단어로 섞어 모델이 더 견고하게 문맥을 학습하도록 합니다."}, {"q": "In-Context Learning(ICL)에서 Zero-shot, One-shot, Few-shot의 공통점은?", "opts": ["모두 동일한 개수의 예시를 사용한다", "모두 모델 파라미터(가중치)를 업데이트한다", "모두 그레디언트 업데이트 없이 프롬프트만으로 작업을 수행한다", "모두 파인튜닝이 필수다"], "a": 2, "e": "Zero/One/Few-shot 모두 공통적으로 모델 가중치는 전혀 바뀌지 않습니다. 프롬프트에 적힌 설명과 예시(0개, 1개, 여러 개)만 보고 그 패턴을 따라 작업을 수행하는 것이 In-Context Learning의 핵심입니다."}, {"q": "Chain-of-Thought(CoT) Prompting이 정답률을 높이는 방식은?", "opts": ["더 많은 예시를 단순 나열한다", "질문을 더 짧게 줄인다", "모델의 파라미터 수를 늘린다", "답만 보여주는 대신 중간 추론 과정을 예시에 포함시켜 모델이 단계를 밟아가며 답하도록 유도한다"], "a": 3, "e": "CoT는 정답만 제시하는 대신 '해답까지의 논리적 추론 과정'을 예시에 함께 보여줘, 모델이 같은 방식으로 단계를 밟아가며 답하도록 유도합니다. 이는 특히 여러 단계를 거쳐야 하는 수학 문제 등에서 정답률을 크게 끌어올립니다."}];
let idx=0, score=0, answered=false;
const qbox=document.getElementById('qbox'), bar=document.getElementById('bar'), prog=document.getElementById('progress'), resultBox=document.getElementById('result');
function render(){
  answered=false;
  const item=Q[idx];
  prog.textContent = (idx+1)+' / '+Q.length+'   맞은 개수: '+score;
  bar.style.width = Math.round((idx/Q.length)*100)+'%';
  let optsHtml = item.opts.map((o,i)=>
    '<button class="opt" data-i="'+i+'">'+(i+1)+') '+o+'</button>'
  ).join('');
  qbox.innerHTML =
    '<p class="question">'+item.q+'</p>'+
    optsHtml+
    '<div id="fb"></div>'+
    '<button id="next">'+(idx===Q.length-1?'결과 보기':'다음 문제')+'</button>';
  qbox.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered=true;
      const chosen=parseInt(btn.getAttribute('data-i'));
      const correct = chosen===item.a;
      if(correct) score++;
      qbox.querySelectorAll('.opt').forEach(b=>{
        const i=parseInt(b.getAttribute('data-i'));
        if(i===item.a){ b.style.borderColor='var(--success-border)'; b.style.background='var(--success-bg)'; b.style.color='var(--success-text)'; }
        else if(i===chosen){ b.style.borderColor='var(--danger-border)'; b.style.background='var(--danger-bg)'; b.style.color='var(--danger-text)'; }
        b.disabled=true;
      });
      const fb=document.getElementById('fb');
      fb.style.display='block';
      fb.style.background = correct ? 'var(--success-bg)' : 'var(--danger-bg)';
      fb.style.color = correct ? 'var(--success-text)' : 'var(--danger-text)';
      fb.textContent = (correct ? '정답이에요. ' : '아쉬워요, 정답은 '+(item.a+1)+'번이에요. ') + item.e;
      document.getElementById('next').style.display='block';
      prog.textContent = (idx+1)+' / '+Q.length+'   맞은 개수: '+score;
    });
  });
  document.getElementById('next').addEventListener('click', ()=>{
    idx++;
    if(idx>=Q.length){ showResult(); } else { render(); }
  });
}
function showResult(){
  bar.style.width='100%';
  qbox.style.display='none';
  prog.style.display='none';
  document.getElementById('bar-outer').style.display='none';
  resultBox.style.display='block';
  const pct=Math.round((score/Q.length)*100);
  resultBox.innerHTML =
    '<p class="score">'+score+' / '+Q.length+'</p>'+
    '<p class="pct">정답률 '+pct+'%</p>'+
    '<button id="retry">다시 풀기</button>';
  document.getElementById('retry').addEventListener('click', ()=>{
    idx=0; score=0;
    resultBox.style.display='none';
    document.getElementById('bar-outer').style.display='block';
    qbox.style.display='block'; prog.style.display='block'; render();
  });
}
render();
</script>
</body>
</html>
