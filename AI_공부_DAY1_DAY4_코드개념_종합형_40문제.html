<script>
const Q=[[1,"【개념】 지도학습에서 회귀와 분류를 구분하는 기준은?",["입력 특성의 개수","데이터프레임의 행 수","그래프의 색상","예측할 정답이 연속값인지 범주인지"],3,"연속적인 수치를 예측하면 회귀, 정해진 범주를 예측하면 분류다."],[1,"【코드】 데이터의 행·열 개수와 열별 자료형을 함께 점검할 때 적절한 조합은?",["df.backward()와 df.step()","df.encode()와 df.decode()","df.shape와 df.info()","df.fit()과 df.predict()"],2,"shape은 행·열 크기를, info는 열별 non-null 개수와 dtype 등을 보여준다."],[1,"【개념】 Feature와 Label의 관계로 옳은 것은?",["둘 다 결측치 처리 방식","Feature는 예측 근거이고 Label은 모델이 맞힐 목표값","Feature가 정답이고 Label이 입력","둘 다 모델의 평가 점수"],1,"모델은 Feature를 입력으로 받아 Label을 예측하도록 학습한다."],[1,"【코드】 열별 결측치 개수를 계산하는 표현은?",["df.isnull().sum()","df.mean().fit()","df.shape.null()","df.predict_missing()"],0,"isnull로 결측 여부를 만든 뒤 열 방향으로 True 값을 합산한다."],[1,"【개념】 질병 진단에서 실제 환자를 놓치지 않는 것이 가장 중요하다면 우선 확인할 지표는?",["Precision","R²","MAE","Recall"],3,"Recall은 실제 양성 중 모델이 양성으로 찾아낸 비율이므로 미탐 방지와 관련된다."],[1,"【코드】 `model.predict_proba(X_test)[:, 1]`이 반환하는 것은?",["모델의 회귀계수","각 특성의 평균","각 표본이 양성 클래스에 속할 예측 확률","최종 0·1 클래스만"],2,"predict_proba의 두 번째 열은 일반적인 이진분류에서 클래스 1의 확률이다."],[1,"【개념】 훈련 성능은 매우 높지만 검증 성능이 크게 낮은 상태는?",["완전한 일반화","과적합","과소적합","정규화 완료"],1,"훈련 데이터를 지나치게 학습해 새로운 데이터에 일반화하지 못하는 과적합 패턴이다."],[1,"【코드】 데이터 누수를 막는 올바른 표준화 코드는?",["scaler.fit(X_train); scaler.transform(X_train); scaler.transform(X_test)","scaler.fit(X_test); scaler.transform(X_train)","scaler.fit(pd.concat([X_train,X_test]))","X_test.fit(scaler)"],0,"평균과 표준편차는 train에서만 학습하고 같은 변환을 test에 적용한다."],[1,"【개념】 K-겹 교차검증을 사용하는 주된 이유는?",["테스트 데이터를 모델 학습에 고정적으로 포함","결측치를 자동 생성","특성 이름을 변경","여러 분할의 결과를 평균내 성능을 더 안정적으로 추정"],3,"한 번의 홀드아웃 결과가 특정 분할에 좌우되는 문제를 줄인다."],[1,"【코드】 RMSE를 계산하는 표현은?",["df.corr(y_test, y_pred)","len(y_test) + len(y_pred)","np.sqrt(mean_squared_error(y_test, y_pred))","accuracy_score(y_test, y_pred)"],2,"MSE에 제곱근을 적용하면 원래 타겟과 같은 단위의 RMSE가 된다."],[2,"【개념】 선형회귀의 최소제곱법이 최소화하는 값은?",["은닉층 개수","잔차제곱합","분류 정확도","클래스 개수"],1,"실제값과 예측값 차이인 잔차를 제곱해 모두 더한 값을 최소화한다."],[2,"【코드】 shape `(16, 4)`인 입력을 `nn.Linear(4, 2)`에 넣었을 때 출력 shape은?",["(16, 2)","(4, 2)","(2, 16)","(16, 4, 2)"],0,"batch 차 e","scaler.fit과 scaler.mean_","loss.backward와 optimizer.step"],0,"encode는 텍스트를 ID로, decode는 ID를 읽을 수 있는 텍스트로 바꾼다."],[3,"【개념】 기본 RNN이 긴 문맥을 학습하기 어려운 대표 원인은?",["항상 단어가 하나뿐","임베딩을 사용할 수 없음","출력이 연속값이라서","기울기 소실로 먼 과거 정보의 영향이 약해짐"],3,"시간축 역전파 과정이 길어지면 gradient가 매우 작아질 수 있다."],[3,"【코드】 `tokenizer(texts, padding=True, truncation=True, max_length=128)`의 의미는?",["어휘를 128개로 재학습","문장을 128개 클래스로 분류","짧은 입력은 채우고 긴 입력은 최대 128토큰으로 자름","모든 입력을 128번 반복"],2,"padding과 truncation을 함께 사용해 batch의 처리 길이를 관리한다."],[3,"【개념】 Attention이 기본 Seq2Seq의 병목을 줄이는 방식은?",["학습률을 0으로 설정","디코더가 인코더의 여러 시점 표현을 직접 가중 참조","입력 문장을 모두 삭제","문장을 항상 한 단어로 축소"],1,"하나의 고정 문맥 벡터에만 의존하지 않고 출력 시점마다 필요한 입력 정보에 주목한다."],[3,"【코드】 hidden_size=768, num_heads=12일 때 head_dim은?",["64","12","96","768"],0,"768÷12=64로 각 head에 같은 차원을 배분한다."],[3,"【개념】 Transformer에서 Positional Encoding과 Causal Mask의 역할 조합은?",["결측치 대체와 이상치 삭제","클래스 비율 유지와 표준화","어휘 생성과 파일 저장","순서 정보 제공과 미래 토큰 참조 차단"],3,"self-attention의 순서 부재는 위치 인코딩으로, 자기회귀의 미래 참조는 mask로 보완한다."],[3,"【코드】 `GPT2Tokenizer.from_pretrained(\"gpt2\")`가 수행하는 일은?",["모델 파라미터 삭제","텍스트를 자동 분류","GPT-2 체크포인트의 토크나이저 설정과 어휘 로드","빈 어휘만 생성"],2,"사전학습 GPT-2와 호환되는 tokenizer 파일을 불러온다."],[4,"【개념】 텍스트 파운데이션 모델의 핵심 기반 조합은?",["HTML·CSS·SQL","대규모 데이터·자기지도학습·Transformer","소량 데이터·수동 규칙·K-means","정답 없는 표 하나·선형회귀"],1,"대규모 텍스트에서 자기지도 방식으로 Transformer를 학습하는 것이 핵심 기반이다."],[4,"【코드】 `.env`에 저장된 API 키를 읽는 코드 조합은?",["load_dotenv(); os.getenv(\"GMS_KEY\")","json.loads(); df.mean()","model.fit(); model.predict()","torch.save(); torch.load()"],0,"load_dotenv로 환경변수를 등록한 뒤 os.getenv로 값을 가져온다."],[4,"【개념】 InstructGPT식 학습의 올바른 흐름은?",["PPO → K-means → PCA","토큰화 → 회귀 → 군집","RAG → 데이터 삭제 → SFT","SFT → 선호 데이터로 보상 모델 학습 → PPO"],3,"모범 응답 지도학습 후 사람의 선호를 학습하고 강화학습으로 정책을 조정한다."],[4,"【코드】 Chat API의 messages에서 system과 user 역할을 바르게 사용한 것은?",["둘 다 빈 문자열만","user에 환경변수 파일 전체","system에 역할·규칙, user에 실제 요청","system에 API 키, user에 모델 가중치"],2,"system은 상위 지침, user는 현재 처리할 요청을 전달한다."],[4,"【개념】 Greedy, Top-K, Top-P의 차이로 옳은 것은?",["셋 모두 데이터 전처리 방법","Greedy는 최고 확률 하나, Top-K는 상위 K개, Top-P는 누적확률 집합 사용","셋 모두 항상 같은 토큰 선택","셋 모두 모델 재학습 방법"],1,"세 방법은 다음 토큰 후보를 선택하는 범위와 샘플링 방식이 다르다."],[4,"【코드】 생성 다양성을 낮추고 더 결정적인 답변을 원할 때 일반적으로 temperature는?",["낮춘다","무조건 10 이상으로 올린다","문자열로 바꾼다","삭제하면 항상 무작위가 된다"],0,"낮은 temperature는 높은 확률 토큰에 분포를 집중시킨다."],[4,"【개념】 Zero-shot, Few-shot, CoT를 바르게 구분한 것은?",["모두 모델 파라미터 업데이트","모두 검색 전용 기법","모두 같은 프롬프트","예시 없음, 소수 예시 제공, 단계적 추론 유도"],3,"세 방식은 프롬프트에 예시와 추론 지시를 제공하는 정도가 다르다."],[4,"【코드】 JSON 문자열을 dict로 바꾸고, dict를 JSON 문자열로 바꾸는 함수 순서는?",["str.fit, dict.predict","os.getenv, load_dotenv","json.loads, json.dumps","json.dumps, json.loads"],2,"loads는 역직렬화, dumps는 직렬화를 수행한다."],[4,"【개념】 환각을 줄이기 위해 RAG를 사용하는 이유는?",["프롬프트를 비움","관련 외부 문서를 검색해 답변 근거로 제공","모델의 모든 출력을 삭제","temperature를 항상 최대로 설정"],1,"검색된 최신·관련 정보를 문맥으로 제공하여 근거 없는 생성을 완화한다."],[4,"【코드】 `filtered = [x for x in data if x[\"score\"] >= 7]`의 결과는?",["score가 7 이상인 항목만 남긴 리스트","모든 score를 7로 변경","7번째 항목만 반환","data를 문자열로 변환"],0,"조건부 리스트 컴프리헨션으로 품질 기준을 만족한 데이터만 선택한다."]];
const quiz=document.querySelector('#quiz'),status=document.querySelector('#status'),result=document.querySelector('#result');let graded=false,day='all',wrong=false;
function draw(){quiz.innerHTML='';Q.forEach((q,i)=>{const saved=localStorage.getItem('ai40_comprehensive_20260813_'+i);const el=document.createElement('article');el.className='q';el.dataset.day=q[0];el.dataset.i=i;el.innerHTML=`<div class="meta"><span class="tag">DAY ${q[0]}</span><span>${i+1}번</span></div><h2>${q[1]}</h2>${q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${saved==j?'checked':''}>${j+1}. ${o}</label>`).join('')}<div class="explain"><div class="answer">정답: ${q[3]+1}번</div>${q[4]}</div>`;quiz.append(el)});if(graded)mark();filter();count()}
function count(){const n=Q.filter((_,i)=>localStorage.getItem('ai40_comprehensive_20260813_'+i)!==null).length;status.textContent=`${n} / 40 선택`}
function mark(){let score=0;document.querySelectorAll('.q').forEach(el=>{const i=+el.dataset.i,v=localStorage.getItem('ai40_comprehensive_20260813_'+i);el.classList.add('graded');el.classList.remove('correct','wrong');if(v!==null&&+v===Q[i][3]){el.classList.add('correct');score++}else el.classList.add('wrong')});result.classList.add('show');result.textContent=`총점 ${score} / 40점 · 정답률 ${Math.round(score/40*100)}%`;localStorage.setItem('ai40_comprehensive_20260813_',score)}
function filter(){document.querySelectorAll('.q').forEach(el=>{const d=day==='all'||el.dataset.day===day;const w=!wrong||el.classList.contains('wrong');el.hidden=!(d&&w)})}
quiz.addEventListener('change',e=>{if(e.target.matches('input')){localStorage.setItem('ai40_comprehensive_20260813_'+e.target.name.slice(1),e.target.value);count()}});document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.day){day=e.target.dataset.day;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b===e.target));filter()}});document.querySelector('#wrongOnly').onclick=e=>{wrong=!wrong;e.target.classList.toggle('active',wrong);filter()};document.querySelector('#grade').onclick=()=>{graded=true;mark();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{if(confirm('선택과 점수를 모두 초기화할까요?')){Object.keys(localStorage).filter(k=>k.startsWith('ai40_comprehensive_20260813_')).forEach(k=>localStorage.removeItem(k));graded=false;result.classList.remove('show');draw()}};draw();
</script></body></html>
