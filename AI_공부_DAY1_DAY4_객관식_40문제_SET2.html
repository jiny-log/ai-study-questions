,"Dataset에서 인덱스 하나에 해당하는 입력과 정답을 반환하는 메서드는?",["__getitem__","__setattr__","__call_model__","__epoch__"],0,"__getitem__(idx)가 idx번째 sample을 구성해 반환한다."],[2,"학습용 DataLoader에 `shuffle=True`를 주는 이유는?",["epoch마다 표본 순서를 섞기 위해","batch 크기를 1로 만들기 위해","자료형을 변경하기 위해","검증 점수를 계산하기 위해"],0,"항상 같은 순서로 학습하는 영향을 줄이도록 매 epoch 순서를 섞는다."],[2,"`nn.Sequential`의 역할은?",["여러 층을 입력 순서대로 연결","데이터를 무작위 분할","손실을 출력 파일로 저장","tensor를 numpy로만 변환"],0,"Sequential에 등록된 layer들이 차례로 입력을 전달받는다."],[2,"이진분류에서 마지막 Sigmoid 없이 logits를 직접 받을 수 있는 손실함수는?",["BCEWithLogitsLoss","MSELoss만","NLLLoss without log","L1Loss"],0,"BCEWithLogitsLoss는 sigmoid와 BCE를 수치적으로 안정되게 결합한다."],[2,"`DataLoader(dataset, batch_size=16)`에서 batch_size의 의미는?",["한 번의 반복에서 꺼내는 표본 수","전체 epoch 수","입력 특성 수","모델 층 수"],0,"batch_size는 DataLoader가 한 iteration마다 묶어 반환할 sample 수다."],[2,"출력 shape이 (32,1)이고 정답이 (32,)일 때 `squeeze(1)`의 결과는?",["(32,)","(1,32)","(32,1,1)","스칼라"],0,"크기가 1인 두 번째 축을 제거해 정답 shape과 맞춘다."],[2,"재현 가능한 PyTorch 난수를 위해 사용하는 함수는?",["torch.manual_seed","torch.random_delete","torch.fixed_grad","torch.equal_seed"],0,"manual_seed는 PyTorch 난수 생성기의 seed를 설정한다."],[3,"토크나이저의 encode가 수행하는 변환은?",["텍스트를 token ID 배열로 변환","ID를 자연어로 복원","벡터를 군집화","문장 점수 계산"],0,"encode는 문자열을 모델이 처리할 정수 token ID로 바꾼다."],[3,"토크나이저의 decode가 수행하는 변환은?",["token ID를 읽을 수 있는 텍스트로 복원","텍스트를 one-hot으로만 변환","attention score 계산","어휘를 삭제"],0,"decode는 ID sequence를 토큰 문자열과 텍스트로 되돌린다."],[3,"padding의 목적은?",["배치 안 문장 길이를 맞춤","모든 단어 의미를 동일하게 만듦","어휘 크기를 1로 줄임","미래 토큰을 학습"],0,"길이가 다른 문장을 tensor batch로 묶을 수 있도록 짧은 문장을 채운다."],[3,"attention_mask에서 padding 위치를 0으로 표시하는 이유는?",["모델이 채움 토큰에 주의를 주지 않게 하기 위해","padding을 정답으로 만들기 위해","문장을 역순으로 바꾸기 위해","head 수를 늘리기 위해"],0,"실제 입력이 아닌 padding token이 attention과 출력에 영향을 주는 것을 막는다."],[3,"BPE 학습의 첫 단계에 가장 가까운 것은?",["초기 단위를 문자 또는 기본 symbol로 나눔","문장 라벨을 사람이 입력","모든 단어를 하나로 병합","모델의 logits 계산"],0,"BPE는 작은 symbol에서 시작해 빈번한 인접 쌍을 차례로 병합한다."],[3,"hidden_size=768, num_heads=12일 때 한 head의 차원은?",["32","64","96","768"],1,"head_dim=hidden_size/num_heads=768/12=64이다."],[3,"hidden_size가 num_heads로 나누어떨어져야 하는 이유는?",["각 head에 같은 크기의 차원을 배분하기 위해","어휘 수를 정하기 위해","문장 수를 세기 위해","loss를 정수로 만들기 위해"],0,"전체 hidden dimension을 여러 attention head로 균등하게 분할한다."],[3,"QKV tensor를 multi-head 형태로 바꾼 뒤 transpose하는 목적은?",["head 축을 분리해 head별 attention 계산","token ID를 문자열로 변환","배치 축 제거","가중치 초기화"],0,"일반적으로 (batch, heads, seq, head_dim) 형태로 만들어 병렬 계산한다."],[3,"Transformer block의 residual connection이 수행하는 연산은?",["하위층 입력을 변환 결과에 더함","모든 값을 0으로 만듦","문장 길이를 절반으로 자름","softmax를 두 번 적용"],0,"잔차 연결은 x와 sublayer(x)를 더해 정보·gradient 흐름을 돕는다."],[3,"`from_pretrained(\"gpt2\")`의 의미는?",["저장된 GPT-2 설정과 가중치를 불러옴","빈 모델을 무작위로만 생성","데이터를 자동 번역","토크나이저를 삭제"],0,"Hugging Face의 사전학습 체크포인트를 로드한다."],[4,"`.env` 파일을 읽어 현재 프로세스 환경변수로 등록하는 함수는?",["load_dotenv","json.loads","os.remove","client.fit"],0,"python-dotenv의 load_dotenv가 .env 파일 내용을 환경변수로 불러온다."],[4,"환경변수 `GMS_KEY` 값을 코드에서 가져오는 표현은?",["os.getenv(\"GMS_KEY\")","os.path(\"GMS_KEY\")","json.getkey()","load.key.fit()"],0,"os.getenv는 이름에 해당하는 환경변수 값을 반환한다."],[4,".env를 .gitignore에 넣는 가장 중요한 이유는?",["API 키가 저장소에 커밋되는 것을 방지","모델 속도를 높임","JSON 형식을 강제","패키지를 자동 설치"],0,"비밀 키가 Git 이력과 원격 저장소에 노출되지 않도록 제외한다."],[4,"Chat Completion messages에서 system 역할의 내용은?",["모델의 역할과 전반적 규칙","사용자의 실제 질문만","모델이 생성한 최종 답변","API 오류 코드"],0,"system message는 대화 전체에 적용할 상위 지침을 전달한다."],[4,"`response.choices[0].message.content`가 가리키는 것은?",["첫 번째 생성 후보의 답변 본문","API 키","모델 파라미터 수","요청의 HTTP 상태만"],0,"choices의 첫 생성 결과에서 assistant message 내용을 꺼내는 표현이다."],[4,"문자열 형태의 JSON 응답을 파이썬 dict로 바꾸는 함수는?",["json.loads","json.dumps","str.encode","dict.fit"],0,"loads는 JSON 문자열을 파이썬 객체로 역직렬화한다."],[4,"`json.dumps(data, ensure_ascii=False)`에서 옵션의 효과는?",["한국어를 유니코드 이스케이프 대신 그대로 보존","모든 값을 ASCII로 삭제","dict를 불러옴","JSON Schema를 생성"],0,"ensure_ascii=False이면 한글이 \\uXXXX 형태로 바뀌지 않는다."],[4,"응답이 ```json 코드블록으로 감싸졌을 때 파싱 전 필요한 처리는?",["코드 펜스와 언어 표기를 제거","내용을 모두 대문자로 변경","score를 먼저 계산","API를 다시 학습"],0,"json.loads가 순수 JSON 문자열을 받도록 Markdown fence를 벗긴다."],[4,"페르소나 템플릿의 `{tone}`과 `{description}`을 실제 값으로 채우는 문자열 메서드는?",["format","append","astype","backward"],0,"template.format(tone=..., description=...)으로 placeholder를 치환한다."],[4,"세 평가 기준의 점수가 [4,5,3]이라면 average_score는?",["3","4","5","12"],1,"합계 12를 기준 수 3으로 나누면 평균은 4다."]];
const quiz=document.querySelector('#quiz'),status=document.querySelector('#status'),result=document.querySelector('#result');let graded=false,day='all',wrong=false;
function draw(){quiz.innerHTML='';Q.forEach((q,i)=>{const saved=localStorage.getItem('ai40_fresh2_20260813_'+i);const el=document.createElement('article');el.className='q';el.dataset.day=q[0];el.dataset.i=i;el.innerHTML=`<div class="meta"><span class="tag">DAY ${q[0]}</span><span>${i+1}번</span></div><h2>${q[1]}</h2>${q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${saved==j?'checked':''}>${j+1}. ${o}</label>`).join('')}<div class="explain"><div class="answer">정답: ${q[3]+1}번</div>${q[4]}</div>`;quiz.append(el)});if(graded)mark();filter();count()}
function count(){const n=Q.filter((_,i)=>localStorage.getItem('ai40_fresh2_20260813_'+i)!==null).length;status.textContent=`${n} / 40 선택`}
function mark(){let score=0;document.querySelectorAll('.q').forEach(el=>{const i=+el.dataset.i,v=localStorage.getItem('ai40_fresh2_20260813_'+i);el.classList.add('graded');el.classList.remove('correct','wrong');if(v!==null&&+v===Q[i][3]){el.classList.add('correct');score++}else el.classList.add('wrong')});result.classList.add('show');result.textContent=`총점 ${score} / 40점 · 정답률 ${Math.round(score/40*100)}%`;localStorage.setItem('ai40_fresh2_20260813_score',score)}
function filter(){document.querySelectorAll('.q').forEach(el=>{const d=day==='all'||el.dataset.day===day;const w=!wrong||el.classList.contains('wrong');el.hidden=!(d&&w)})}
quiz.addEventListener('change',e=>{if(e.target.matches('input')){localStorage.setItem('ai40_fresh2_20260813_'+e.target.name.slice(1),e.target.value);count()}});document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.day){day=e.target.dataset.day;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b===e.target));filter()}});document.querySelector('#wrongOnly').onclick=e=>{wrong=!wrong;e.target.classList.toggle('active',wrong);filter()};document.querySelector('#grade').onclick=()=>{graded=true;mark();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{if(confirm('선택과 점수를 모두 초기화할까요?')){Object.keys(localStorage).filter(k=>k.startsWith('ai40_fresh2_20260813_')).forEach(k=>localStorage.removeItem(k));graded=false;result.classList.remove('show');draw()}};draw();
