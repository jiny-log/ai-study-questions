<script>

function count(){const n=Q.filter((_,i)=>localStorage.getItem('ai40_set2_'+i)!==null).length;status.textContent=`${n} / 40 선택`}
function mark(){let score=0;document.querySelectorAll('.q').forEach(el=>{const i=+el.dataset.i,v=localStorage.getItem('ai40_set2_'+i);el.classList.add('graded');el.classList.remove('correct','wrong');if(v!==null&&+v===Q[i][3]){el.classList.add('correct');score++}else el.classList.add('wrong')});result.classList.add('show');result.textContent=`총점 ${score} / 40점 · 정답률 ${Math.round(score/40*100)}%`;localStorage.setItem('ai40_set2_score',score)}
function filter(){document.querySelectorAll('.q').forEach(el=>{const d=day==='all'||el.dataset.day===day;const w=!wrong||el.classList.contains('wrong');el.hidden=!(d&&w)})}
quiz.addEventListener('change',e=>{if(e.target.matches('input')){localStorage.setItem('ai40_set2_'+e.target.name.slice(1),e.target.value);count()}});document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.day){day=e.target.dataset.day;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b===e.target));filter()}});document.querySelector('#wrongOnly').onclick=e=>{wrong=!wrong;e.target.classList.toggle('active',wrong);filter()};document.querySelector('#grade').onclick=()=>{graded=true;mark();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{if(confirm('선택과 점수를 모두 초기화할까요?')){Object.keys(localStorage).filter(k=>k.startsWith('ai40_set2_')).forEach(k=>localStorage.removeItem(k));graded=false;result.classList.remove('show');draw()}};draw();
</script></body></html>
