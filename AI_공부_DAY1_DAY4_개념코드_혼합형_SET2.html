<script>
const Q=[[1,"【개념】 EDA를 모델 학습 전에 수행하는 가장 중요한 이유는?",["모든 변수를 문자열로 바꾸기 위해","모델 계수를 직접 정하기 위해","데이터의 구조·분포·품질 문제를 파악하기 위해","테스트 점수를 미리 높이기 위해"],2,"EDA는 분포, 결측치, 이상치, 변수 관계를 확인하여 전처리와 모델링 방향을 정하는 과정이다."],[1,"【코드】 `df.info()`로 직접 확인하기 어려운 정보는?",["두 변수의 상관계수","열별 결측이 아닌 값의 개수","열별 자료형","메모리 사용량"],0,"info()는 행·열 구조, non-null 개수, dtype과 메모리 정보를 보여주지만 상관계수는 corr() 등으로 구한다."],[1,"【개념】 범주형 변수와 연속형 변수를 구분해야 하는 이유로 적절한 것은?",["자료형에 따라 요약·시각화·전처리 방법이 달라지기 때문","범주형 변수는 항상 삭제해야 하기 때문","연속형 변수에는 결측치가 없기 때문","두 자료형은 같은 분석법만 사용하기 때문"],0,"범주형은 빈도·비율, 연속형은 평균·분산·분포 등 적절한 분석 방법이 다르다."],[1,"【코드】 수치형 열만 선택하는 pandas 표현은?",["df.select_rows(\"number\")","df.numeric_only()","df.columns.astype(\"number\")","df.select_dtypes(include=\"number\")"],3,"select_dtypes의 include에 number를 지정하면 수치형 dtype 열을 선택한다."],[1,"【개념】 결측치를 평균 대신 중앙값으로 대체하기에 특히 적절한 경우는?",["범주 이름으로만 구성된 변수","결측치가 전혀 없는 변수","분포가 치우치고 극단값이 있는 수치 변수","모든 값이 동일한 변수"],2,"중앙값은 평균보다 극단값의 영향을 덜 받아 치우친 수치 자료에서 안정적이다."],[1,"【코드】 `df[\"age\"] = df[\"age\"].fillna(df[\"age\"].median())`의 결과는?",["중앙값보다 작은 행을 제거","age의 결측치를 age 중앙값으로 대체","age의 모든 값을 중앙값으로 변경","age 열을 삭제"],1,"fillna에 중앙값을 전달해 결측 위치만 채우고 나머지 값은 유지한다."],[1,"【개념】 표본이 특정 연령대에만 치우친 경우 가장 우려되는 문제는?",["모집단을 제대로 대표하지 못하는 표본 편향","모든 결측치가 자동 제거","열 이름이 변경","자료형이 모두 정수로 변환"],0,"특정 집단이 과도하게 포함되면 분석 결과를 전체 모집단에 일반화하기 어렵다."],[1,"【코드】 `df.sample(n=5, random_state=42)`의 결과는?",["앞의 5열 선택","결측치 5개 대체","값이 큰 5행만 선택","재현 가능한 방식으로 임의의 5행 선택"],3,"sample은 무작위 행 표본을 반환하며 random_state를 고정하면 같은 결과를 재현한다."],[1,"【개념】 IQR 경계를 벗어난 관측값을 발견했을 때 가장 적절한 태도는?",["무조건 평균으로 변경","항상 정상값으로 간주","오류인지 의미 있는 극단 사례인지 확인한 뒤 처리","조건 없이 모두 삭제"],2,"통계적 이상치가 반드시 데이터 오류는 아니므로 도메인과 원자료를 확인해야 한다."],[1,"【코드】 분류 자료를 나눌 때 `train_test_split(X, y, stratify=y)`를 쓰는 목적은?",["모든 행을 학습셋에 포함","분할 후에도 클래스 비율을 비슷하게 유지","특성값을 0과 1로 변환","중복 행을 제거"],1,"stratify=y는 각 분할에 원본과 유사한 클래스 비율이 유지되도록 한다."],[2,"【개념】 PyTorch tensor가 일반적인 NumPy 배열과 비교해 갖는 대표 기능은?",["자동미분과 가속기 연산 지원","문자열만 저장 가능","행렬 연산 불가","항상 1차원으로만 생성"],0,"tensor는 NumPy와 유사한 연산에 더해 autograd와 GPU 같은 가속기 사용을 지원한다."],[2,"【코드】 `x = torch.tensor(3.0, requires_grad=True)`에서 `requires_grad=True`의 의미는?",["x를 정수로 고정","x를 GPU로 즉시 이동","x의 값을 0으로 초기화","x가 포함된 연산의 미분값을 추적"],3,"autograd가 x와 관련된 계산 그래프를 기록해 backward 후 x.grad를 구할 수 있다."],[2,"【개념】 epoch와 iteration의 관계로 옳은 것은?",["두 용어는 모델 층 수를 뜻한다","epoch는 평가에서만 사용한다","한 epoch는 전체 학습 데이터를 한 번 처리하는 과정이고 여러 iteration으로 구성될 수 있다","한 iteration은 항상 전체 데이터 100회 처리다"],2,"mini-batch 학습에서는 여러 batch iteration을 완료해야 전체 데이터를 한 번 본 epoch가 된다."],[2,"【코드】 사용자 정의 Dataset에서 `__len__`이 반환해야 하는 값은?",["모델 파라미터 수","전체 표본 수","입력 특성 평균","정답 클래스 이름"],1,"DataLoader는 __len__을 통해 Dataset에 포함된 sample 수를 확인한다."],[2,"【개념】 신경망에 활성화함수가 필요한 핵심 이유는?",["비선형 관계를 표현하기 위해","입력 파일을 읽기 위해","batch를 정렬하기 위해","정답을 자동 생성하기 위해"],0,"선형층만 여러 개 합성하면 하나의 선형변환과 같으므로 비선형 활성화함수가 표현력을 확장한다."],[2,"【코드】 입력 shape이 `(32, 5)`일 때 `nn.Linear(5, 3)`의 출력 shape은?",["(5, 3)","(3, 5)","(32, 5, 3)","(32, 3)"],3,"마지막 특성 차원 5가 출력 차원 3으로 변환되고 batch 크기 32는 유지된다."],[2,"【개념】 학습 단계와 평가 단계에서 모델의 동작 모드를 구분해야 하는 대표 이유는?",["학습 단계에는 tensor를 쓸 수 없기 때문","평가 단계에서 층 수가 자동 증가하기 때문","Dropout과 BatchNorm의 동작이 달라지기 때문","평가 단계에서 입력이 사라지기 때문"],2,"일부 layer는 train/eval 모드에 따라 난수 적용이나 통계 사용 방식이 달라진다."],[2,"【코드】 일반적인 PyTorch 학습 반복의 올바른 순서는?",["backward → forward → zero_grad","zero_grad → forward → loss → backward → step","step → backward → 데이터 삭제","loss → zero_grad → 모델 저장만"],1,"기존 gradient를 지우고 순전파·손실 계산 후 역미분을 계산하여 optimizer가 갱신한다."],[2,"【개념】 가중치 초기화가 모두 같은 값이면 생길 수 있는 문제는?",["같은 층의 뉴런이 비슷한 표현만 학습하는 대칭성 문제","입력 데이터가 자동 증강","모든 gradient가 무조건 커짐","분류 클래스가 증가"],0,"뉴런이 동일하게 시작하면 동일한 gradient를 받아 서로 다른 특징을 학습하기 어렵다."],[2,"【코드】 평가 루프에서 `with torch.no_grad():`를 사용하는 효과는?",["모델 파라미터를 삭제","입력을 자동 표준화","평가 결과를 파일로 저장","계산 그래프 생성을 막아 메모리와 연산을 절약"],3,"평가에는 gradient 계산이 필요 없으므로 autograd 기록을 중단한다."],[3,"【개념】 단어 전체 대신 subword 단위 토큰화를 사용하는 장점은?",["단어 순서를 제거","임베딩 학습이 불가능해짐","미등록 단어도 작은 조각의 조합으로 표현 가능","모든 문장을 같은 길이로 만듦"],2,"어휘에 없는 단어도 알려진 접두·어근·문자 조각으로 나눌 수 있어 OOV 문제를 줄인다."],[3,"【코드】 `tokenizer.encode(text)`와 `tokenizer.decode(ids)`의 관계는?",["encode는 파일 저장, decode는 파일 삭제","텍스트를 ID로 바꾸고 ID를 다시 텍스트로 복원","둘 다 모델을 학습","둘 다 attention을 계산"],1,"encode는 토큰 ID 변환, decode는 ID sequence를 문자열로 되돌리는 기능이다."],[3,"【개념】 padding이 필요한 이유는?",["길이가 다른 문장들을 하나의 batch tensor로 묶기 위해","단어 의미를 모두 같게 만들기 위해","어휘 수를 1개로 줄이기 위해","출력 클래스를 늘리기 위해"],0,"batch tensor는 일반적으로 길이가 같아야 하므로 짧은 sequence를 특수 토큰으로 채운다."],[3,"【코드】 `tokenizer(texts, padding=True, truncation=True, max_length=128)`의 동작은?",["모든 입력을 128번 복사","어휘 크기를 128로 고정","텍스트를 128개 클래스로 분류","짧은 입력은 채우고 긴 입력은 최대 128토큰으로 자름"],3,"padding은 짧은 sequence 길이를 맞추고 truncation은 max_length를 넘는 입력을 자른다."],[3,"【개념】 BPE가 어휘를 만드는 기본 원리는?",["사람이 모든 문장을 직접 분류","빈도가 낮은 문장 전체를 삭제","자주 함께 등장하는 인접 단위들을 반복적으로 병합","모든 단어를 하나의 토큰으로 병합"],2,"작은 symbol에서 시작해 빈번한 pair를 합치며 subword vocabulary를 구성한다."],[3,"【코드】 토크나이저 객체에서 현재 전체 어휘 크기를 확인하는 표현은?",["tokenizer.shape[1]","len(tokenizer)","tokenizer.decode()","tokenizer.backward()"],1,"len(tokenizer)는 기본 어휘와 추가된 특수 토큰을 포함한 현재 tokenizer 크기를 반환한다."],[3,"【개념】 Residual connection의 주된 역할은?",["입력 정보를 우회 전달해 깊은 네트워크의 학습을 도움","어휘를 자동 생성","문장 길이를 절반으로 줄임","정답 라벨을 숨김"],0,"sublayer 출력에 입력을 더해 정보와 gradient가 깊은 층을 지나기 쉽게 한다."],[3,"【코드】 `output = layer_norm(x + sublayer(x))`에서 `x + sublayer(x)`가 나타내는 것은?",["토큰화","padding","label shifting","잔차 연결"],3,"변환 전 입력 x를 변환 결과에 더하는 residual 구조다."],[3,"【개념】 Teacher forcing의 설명으로 옳은 것은?",["전체 문장을 한 토큰으로 압축","평가 데이터로 가중치를 수정","학습 시 이전 시점의 실제 정답을 다음 입력으로 사용","모델의 이전 오답만 계속 입력"],2,"decoder 학습을 안정화하기 위해 이전 정답 토큰을 다음 시점 입력으로 제공한다."],[3,"【코드】 `model.generate(input_ids, max_new_tokens=20)`에서 `max_new_tokens`가 제한하는 것은?",["어휘 전체 크기","새롭게 생성할 토큰의 최대 개수","입력 토큰의 최소 개수","모델 층 수"],1,"입력 뒤에 추가 생성할 token 수의 상한을 지정한다."],[4,"【개념】 system message와 user message의 역할 차이는?",["system은 전반적 행동 규칙, user는 현재 요청을 전달","둘 다 API 키만 전달","system은 모델 출력, user는 모델 가중치","두 역할은 항상 완전히 동일"],0,"system은 모델의 역할·제약을 설정하고 user는 처리할 구체적인 요청을 전달한다."],[4,"【코드】 `.env` 파일의 값을 환경변수로 불러오는 함수는?",["json.loads()","model.generate()","pd.read_json()","load_dotenv()"],3,"python-dotenv의 load_dotenv가 .env의 key-value를 현재 환경에 등록한다."],[4,"【개념】 API 키를 소스코드에 직접 작성하지 않아야 하는 이유는?",["데이터프레임을 만들 수 없기 때문","응답 길이가 자동 증가하기 때문","저장소나 공유 과정에서 비밀정보가 노출될 수 있기 때문","모델이 JSON을 출력하지 못하기 때문"],2,"환경변수로 분리하고 .gitignore로 제외해야 키가 코드·Git 이력에 노출되는 위험을 줄인다."],[4,"【코드】 `messages.append({\"role\":\"user\", \"content\":prompt})`가 수행하는 일은?",["평가 점수를 계산","사용자 요청을 대화 메시지 목록에 추가","응답을 dict로 변환","API 키를 삭제"],1,"Chat API에 보낼 messages 배열에 user 역할의 prompt를 추가한다."],[4,"【개념】 JSON 직렬화와 역직렬화의 차이는?",["직렬화는 객체를 JSON 문자열로, 역직렬화는 JSON 문자열을 객체로 변환","둘 다 모델 학습 방식","직렬화는 파일 삭제만 수행","역직렬화는 숫자를 모두 0으로 변경"],0,"파이썬에서는 보통 dumps가 직렬화, loads가 역직렬화를 수행한다."],[4,"【코드】 JSON 문자열 `text`를 파이썬 dict로 바꾸는 표현은?",["json.dumps(text)","text.backward()","dict.generate(text)","json.loads(text)"],3,"json.loads는 JSON 형식 문자열을 파이썬 객체로 파싱한다."],[4,"【개념】 페르소나 기반 데이터 증강의 목적은?",["API 호출을 없애기","정답 필드를 제거","같은 의미를 다양한 어조와 표현으로 생성","모든 문장을 동일하게 복사"],2,"의미는 유지하면서 톤·표현을 달리해 학습 데이터의 다양성을 높인다."],[4,"【코드】 `template.format(tone=\"정중한 말투\")`의 결과는?",["모델을 새로 학습","template의 {tone} 자리를 지정한 문자열로 치환","template을 삭제","tone을 숫자로 변환"],1,"str.format은 이름이 일치하는 placeholder를 전달된 값으로 바꾼다."],[4,"【개념】 페르소나별 번역을 만들 때 반드시 유지해야 할 요소는?",["원문의 핵심 의미와 데이터베이스 용어","모든 문장의 종결어미","문장 길이와 띄어쓰기 수","항상 같은 감정 표현"],0,"어조는 달라져도 Text-to-SQL 질문의 테이블·열·조건 의미가 왜곡되면 안 된다."],[4,"【코드】 `results.append({\"tone\": tone, \"text\": output})`가 수행하는 일은?",["output을 삭제","tone을 정수로 변환","리스트의 첫 항목만 반환","어조와 생성문을 하나의 dict로 묶어 리스트에 추가"],3,"각 페르소나의 어조와 결과를 구조화된 항목으로 누적한다."]];
const quiz=document.querySelector('#quiz'),status=document.querySelector('#status'),result=document.querySelector('#result');let graded=false,day='all',wrong=false;
function draw(){quiz.innerHTML='';Q.forEach((q,i)=>{const saved=localStorage.getItem('ai40_mixed2_20260813_'+i);const el=document.createElement('article');el.className='q';el.dataset.day=q[0];el.dataset.i=i;el.innerHTML=`<div class="meta"><span class="tag">DAY ${q[0]}</span><span>${i+1}번</span></div><h2>${q[1]}</h2>${q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${saved==j?'checked':''}>${j+1}. ${o}</label>`).join('')}<div class="explain"><div class="answer">정답: ${q[3]+1}번</div>${q[4]}</div>`;quiz.append(el)});if(graded)mark();filter();count()}
function count(){const n=Q.filter((_,i)=>localStorage.getItem('ai40_mixed2_20260813_'+i)!==null).length;status.textContent=`${n} / 40 선택`}
function mark(){let score=0;document.querySelectorAll('.q').forEach(el=>{const i=+el.dataset.i,v=localStorage.getItem('ai40_mixed2_20260813_'+i);el.classList.add('graded');el.classList.remove('correct','wrong');if(v!==null&&+v===Q[i][3]){el.classList.add('correct');score++}else el.classList.add('wrong')});result.classList.add('show');result.textContent=`총점 ${score} / 40점 · 정답률 ${Math.round(score/40*100)}%`;localStorage.setItem('ai40_mixed2_20260813_',score)}
function filter(){document.querySelectorAll('.q').forEach(el=>{const d=day==='all'||el.dataset.day===day;const w=!wrong||el.classList.contains('wrong');el.hidden=!(d&&w)})}
quiz.addEventListener('change',e=>{if(e.target.matches('input')){localStorage.setItem('ai40_mixed2_20260813_'+e.target.name.slice(1),e.target.value);count()}});document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.day){day=e.target.dataset.day;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b===e.target));filter()}});document.querySelector('#wrongOnly').onclick=e=>{wrong=!wrong;e.target.classList.toggle('active',wrong);filter()};document.querySelector('#grade').onclick=()=>{graded=true;mark();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{if(confirm('선택과 점수를 모두 초기화할까요?')){Object.keys(localStorage).filter(k=>k.startsWith('ai40_mixed2_20260813_')).forEach(k=>localStorage.removeItem(k));graded=false;result.classList.remove('show');draw()}};draw();
</script></body></html>
