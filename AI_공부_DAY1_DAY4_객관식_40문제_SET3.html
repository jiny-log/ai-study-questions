const Q=[[1,"`df.head(3)`의 실행 결과는?",["데이터프레임의 앞 3행","마지막 3열","결측치 3개","평균 상위 3개"],0,"head(n)는 처음 n개 행을 보여준다."],[1,"특정 범주별 빈도수를 확인하는 메서드는?",["value_counts()","describe_axis()","reshape()","predict_proba()"],0,"Series.value_counts는 고유값별 등장 횟수를 집계한다."],[1,"`value_counts(normalize=True)`가 반환하는 것은?",["각 범주의 비율","열별 평균","정렬된 인덱스 번호만","회귀 예측값"],0,"normalize=True는 개수 대신 전체에서 차지하는 상대 빈도를 반환한다."],[1,"`df.groupby(\"class\")[\"score\"].mean()`의 의미는?",["class별 score 평균","score별 class 이름","전체 score 합","class 열 삭제"],0,"class로 행을 묶은 뒤 각 그룹의 score 평균을 계산한다."],[1,"`pivot_table(index=\"sex\", columns=\"class\", values=\"survived\", aggfunc=\"mean\")`가 만드는 값은?",["성별·등급별 평균 생존율","성별 이름 목록","등급별 결측치만","전체 행 원본"],0,"index와 columns 조합마다 survived 평균을 집계한다."],[1,"연속형 변수 하나의 분포와 밀도를 함께 보고 싶을 때 적절한 seaborn 함수는?",["histplot(..., kde=True)","heatmap","countplot만","scatterplot만"],0,"histplot의 kde=True로 히스토그램과 밀도 곡선을 함께 볼 수 있다."],[1,"두 연속형 변수의 관계를 점으로 확인하는 그래프는?",["scatterplot","countplot","boxplot의 단일 범주","pie only"],0,"산점도는 두 수치 변수의 좌표 관계와 패턴을 보여준다."],[1,"범주별 연속값의 중앙값·사분위수·이상치를 비교하기 좋은 그래프는?",["boxplot","lineplot만","heatmap","barplot of strings"],0,"boxplot은 중앙값, IQR, whisker와 이상치 후보를 범주별로 비교한다."],[1,"`df.drop_duplicates()`의 기능은?",["중복 행 제거","결측 열 제거","상관이 높은 열 제거","라벨 인코딩"],0,"완전히 같은 중복 행을 제거한 데이터프레임을 반환한다."],[1,"`df.loc[df[\"age\"] < 16, \"survived\"]`가 선택하는 것은?",["16세 미만 행의 survived 열","16번째 행 전체","age 열의 마지막 값","모든 열 평균"],0,"loc는 불리언 행 조건과 열 이름을 사용해 원하는 부분을 선택한다."],[2,"shape이 (4,3)인 tensor에서 `x.T`의 shape은?",["(3,4)","(4,3)","(12,)","(1,4,3)"],0,"2차원 tensor 전치는 두 축을 바꾼다."],[2,"shape (2,3)과 (3,4) tensor를 행렬곱한 결과 shape은?",["(2,4)","(3,3)","(2,3,4)","(4,2)"],0,"안쪽 차원 3이 소거되고 바깥 차원 2와 4가 남는다."],[2,"shape (8,)인 tensor에 `unsqueeze(1)`을 적용한 shape은?",["(8,1)","(1,8)","(8,)","(1,1,8)"],0,"1번 위치에 크기 1인 새 축을 삽입한다."],[2,"numpy 배열을 tensor로 바꿀 때 메모리를 공유할 수 있는 함수는?",["torch.from_numpy","torch.fit_numpy","np.backward","tensor.item"],0,"from_numpy로 만든 CPU tensor는 일반적으로 원본 ndarray와 메모리를 공유한다."],[2,"`TensorDataset(X, y)`가 반환하는 한 sample의 형태는?",["(X의 한 행, y의 한 값) 튜플","X 전체만","y 전체만","모델 출력"],0,"같은 첫 차원을 가진 tensor들을 인덱스별 tuple로 묶는다."],[2,"`nn.Linear(4, 2)`에 shape (10,4) 입력을 넣으면 출력 shape은?",["(10,2)","(4,2)","(2,10)","(10,4,2)"],0,"마지막 입력 차원 4가 출력 차원 2로 변환되고 batch 차원 10은 유지된다."],[2,"`pred = logits.argmax(dim=1)`이 반환하는 것은?",["각 표본에서 logit이 가장 큰 클래스 인덱스","모든 클래스 확률의 합","손실 gradient","입력 특성 평균"],0,"argmax(dim=1)는 각 행의 클래스 점수 중 최댓값 위치를 예측 label로 반환한다."],[2,"`model.parameters()`를 optimizer에 전달하는 이유는?",["갱신할 학습 파라미터를 알려주기 위해","입력 데이터를 전달","손실함수를 선택","batch를 섞기 위해"],0,"optimizer는 등록된 parameter의 gradient를 이용해 값을 갱신한다."],[2,"`state_dict()`에 저장되는 내용으로 가장 적절한 것은?",["모델의 학습된 파라미터와 버퍼","원본 학습 데이터 전체","파이썬 패키지 목록","그래프 이미지"],0,"state_dict는 layer별 weight·bias 등 모델 상태를 key-value 형태로 담는다."],[2,"epoch 평균 loss를 올바르게 구하려면 batch loss 합을 무엇으로 나누는가?",["처리한 batch 수 또는 표본 수에 맞게 가중 집계","특성 수만","은닉층 수","클래스 이름"],0,"기록 방식에 따라 batch 평균의 평균 또는 표본 가중 평균으로 일관되게 계산한다."],[3,"토크나이저 어휘에 없는 문자열을 더 작은 subword로 나누는 장점은?",["미등록 단어도 조각으로 표현 가능","모든 문장을 같은 뜻으로 만듦","attention 제거","학습 데이터 삭제"],0,"subword 방식은 단어 전체가 어휘에 없어도 알려진 조각들의 조합으로 표현한다."],[3,"BPE에서 가장 자주 등장한 인접 pair를 찾은 다음 수행하는 작업은?",["그 pair를 새 symbol로 병합","문장 전체 삭제","정답 label 지정","hidden size 변경"],0,"최빈 pair를 합친 token을 어휘에 추가하고 corpus를 갱신한다."],[3,"special token `<eos>`의 일반적 용도는?",["시퀀스 종료 표시","padding 위치만 표시","미등록 단어 표시만","문장 시작 전용"],0,"end-of-sequence token은 생성이나 입력 sequence의 끝을 나타낸다."],[3,"special token `<unk>`가 나타내는 것은?",["어휘에 없는 토큰","문장 끝","padding","분류 정답"],0,"unknown token은 tokenizer 어휘로 표현하지 못한 항목을 대신한다."],[3,"언어모델 학습용 고정 길이 block을 만들 때 긴 token stream에 적용하는 방식은?",["연속 구간으로 잘라 input sequence 생성","모든 token을 평균","첫 token만 사용","알파벳순 정렬"],0,"token stream을 block_size 길이의 연속 window로 나누어 sample을 만든다."],[3,"GPT의 입력과 label을 한 칸 어긋나게 구성하는 이유는?",["현재까지의 토큰으로 다음 토큰을 예측","같은 토큰을 복사만","padding을 늘림","문장 순서를 무시"],0,"위치 t의 출력이 위치 t+1의 정답 token을 맞히도록 shift한다."],[3,"`tokenizer(texts, padding=True, return_tensors=\"pt\")`에서 return_tensors의 효과는?",["결과를 PyTorch tensor 형태로 반환","텍스트를 파일로 저장","어휘를 다시 학습","모델 출력을 문자열로 변환"],0,"return_tensors=\"pt\"는 tokenized batch를 PyTorch tensor로 만든다."],[3,"GPT 설정 객체(config)에 hidden_size 등을 모아두는 장점은?",["모델 하이퍼파라미터를 일관되게 전달·관리","훈련 데이터를 자동 생성","모든 가중치를 0으로 설정","토큰을 자연어로 복원"],0,"설정 객체를 사용하면 여러 모듈이 같은 차원·층 수 값을 공유하고 저장하기 쉽다."],[3,"LayerNorm이 정규화하는 대상으로 가장 가까운 것은?",["각 토큰 표현의 feature 차원","전체 데이터셋 행 수","어휘의 문자열 길이","클래스 빈도"],0,"Transformer의 LayerNorm은 각 위치의 hidden feature를 기준으로 정규화한다."],[3,"`model.generate()`의 주된 기능은?",["주어진 입력 뒤의 token을 자동회귀적으로 생성","모델을 처음부터 학습","어휘 파일 삭제","embedding을 시각화"],0,"generate는 decoding 설정에 따라 후속 token sequence를 생성한다."],[4,"API client의 `base_url`을 별도로 지정하는 이유는?",["요청을 보낼 호환 API endpoint 선택","프롬프트 온도 설정","JSON key 이름 변경","환경변수 삭제"],0,"base_url은 client가 호출할 서버의 기본 endpoint를 지정한다."],[4,"함수 인자 `system_prompt=None`을 둔 설계의 의미는?",["시스템 지침을 선택적으로 받을 수 있음","user prompt를 금지","모델 이름을 숨김","항상 빈 답변 생성"],0,"값이 있을 때만 system message를 추가하는 선택 인자 설계다."],[4,"API 호출에서 `temperature` 인자를 함수 매개변수로 노출하는 장점은?",["호출마다 생성 다양성을 조절 가능","모델 파라미터 수를 변경","API 키를 암호화","메시지 역할을 삭제"],0,"temperature를 인자로 받으면 같은 함수로 보수적·다양한 생성을 실험할 수 있다."],[4,"`messages.append({\"role\":\"user\",\"content\":prompt})`가 수행하는 일은?",["사용자 요청을 메시지 목록에 추가","응답을 JSON으로 파싱","환경변수를 불러옴","평가 점수를 평균"],0,"API에 전달할 대화 배열에 사용자 역할의 prompt를 추가한다."],[4,"`json_parsing` 함수의 반환 자료형 주석 `-> dict`가 뜻하는 것은?",["dict 반환을 기대한다는 타입 힌트","반드시 DB에 저장","입력이 dict여야만 함","함수가 비동기라는 표시"],0,"반환 타입 힌트는 함수 결과가 dict일 것으로 기대됨을 나타낸다."],[4,"`translation_response_format` 같은 설정을 변수로 분리하는 장점은?",["여러 API 호출에서 같은 출력 규칙을 재사용","응답을 무조건 길게 만듦","토큰 사용량을 0으로 만듦","환경변수를 삭제"],0,"반복되는 응답 형식 설정을 한 곳에서 정의해 일관성과 유지보수성을 높인다."],[4,"생성 데이터 3개를 평가 기준 3개로 각각 평가하면 judge 호출 횟수는?",["3회","6회","9회","12회"],2,"데이터마다 모든 기준을 적용하므로 3×3=9회다."],[4,"`avg_score = sum(scores)/len(scores) if scores else 0`에서 조건식의 목적은?",["빈 리스트의 0 나눗셈 방지","점수를 문자열로 변환","항상 평균을 1로 설정","최댓값만 선택"],0,"평가 성공 점수가 하나도 없으면 len이 0이므로 안전하게 0을 반환한다."],[4,"`[t for t in evaluated if t[\"score\"] >= 7]`의 결과는?",["7점 이상 항목만 남긴 리스트","모든 score 합","7번째 항목 하나","score 열 삭제"],0,"조건을 만족하는 원소만 선택하는 리스트 컴프리헨션이다."],[4,"LLM-as-judge 프롬프트에 criteria를 별도 입력으로 넣는 장점은?",["같은 답변을 여러 평가 관점으로 재사용 가능","모델을 매번 재학습","JSON 파싱 불필요","API 호출이 항상 0회"],0,"충실도·정확성 등 평가 기준을 바꿔 동일 출력을 다각도로 평가할 수 있다."]];
const quiz=document.querySelector('#quiz'),status=document.querySelector('#status'),result=document.querySelector('#result');let graded=false,day='all',wrong=false;
function draw(){quiz.innerHTML='';Q.forEach((q,i)=>{const saved=localStorage.getItem('ai40_fresh3_20260813_'+i);const el=document.createElement('article');el.className='q';el.dataset.day=q[0];el.dataset.i=i;el.innerHTML=`<div class="meta"><span class="tag">DAY ${q[0]}</span><span>${i+1}번</span></div><h2>${q[1]}</h2>${q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${saved==j?'checked':''}>${j+1}. ${o}</label>`).join('')}<div class="explain"><div class="answer">정답: ${q[3]+1}번</div>${q[4]}</div>`;quiz.append(el)});if(graded)mark();filter();count()}
function count(){const n=Q.filter((_,i)=>localStorage.getItem('ai40_fresh3_20260813_'+i)!==null).length;status.textContent=`${n} / 40 선택`}
function mark(){let score=0;document.querySelectorAll('.q').forEach(el=>{const i=+el.dataset.i,v=localStorage.getItem('ai40_fresh3_20260813_'+i);el.classList.add('graded');el.classList.remove('correct','wrong');if(v!==null&&+v===Q[i][3]){el.classList.add('correct');score++}else el.classList.add('wrong')});result.classList.add('show');result.textContent=`총점 ${score} / 40점 · 정답률 ${Math.round(score/40*100)}%`;localStorage.setItem('ai40_fresh3_20260813_score',score)}
function filter(){document.querySelectorAll('.q').forEach(el=>{const d=day==='all'||el.dataset.day===day;const w=!wrong||el.classList.contains('wrong');el.hidden=!(d&&w)})}
quiz.addEventListener('change',e=>{if(e.target.matches('input')){localStorage.setItem('ai40_fresh3_20260813_'+e.target.name.slice(1),e.target.value);count()}});document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.day){day=e.target.dataset.day;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b===e.target));filter()}});document.querySelector('#wrongOnly').onclick=e=>{wrong=!wrong;e.target.classList.toggle('active',wrong);filter()};document.querySelector('#grade').onclick=()=>{graded=true;mark();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{if(confirm('선택과 점수를 모두 초기화할까요?')){Object.keys(localStorage).filter(k=>k.startsWith('ai40_fresh3_20260813_')).forEach(k=>localStorage.removeItem(k));graded=false;result.classList.remove('show');draw()}};draw();
</script></body></html>
