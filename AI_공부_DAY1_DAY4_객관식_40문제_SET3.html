<script>

트에 입출력 예시 3개를 주어 형식을 따라 하게 했다. 적용 방법은?",["검색 데이터베이스를 만든다","모델 파라미터를 반드시 업데이트한다","프롬프트에 소수의 입출력 예시를 제공한다","정답을 숨긴다"],2,"예시를 통해 작업 방식과 출력 형식을 모델에 보여준다."],[4,"평가 모델이 답변의 순서·분량·자기 계열에 영향을 받는다. 편향 조합은?",["위치·길이·자기선호 편향","색상·해상도·파일명 편향","평균·분산·중앙값 편향","학습·검증·테스트 편향"],0,"답변의 제시 순서, 길이, 자기 모델 계열 선호가 평가를 왜곡할 수 있다."],[4,"검색 문서를 근거로 제공해 허위 사실 생성을 완화했다. 사용 방법은?",["Temperature를 무조건 최대로 설정","라벨을 모두 삭제","항상 Greedy만 사용","RAG로 외부 근거를 검색해 답변에 제공"],3,"RAG는 관련 외부 자료를 검색해 모델의 답변 근거로 제공함으로써 환각을 줄일 수 있다."],[4,"응답이 항상 지정된 키와 타입을 갖도록 만들려 한다. JSON Schema를 강제하는 이유는?",["검색 속도를 높이기 위해","프롬프트를 이미지로 바꾸기 위해","모델 파라미터 수를 줄이기 위해","출력 필드와 형식을 안정적으로 보장해 파싱 오류를 줄이기 위해"],3,"엄격한 스키마는 필요한 필드만 정해진 타입으로 반환하게 해 후속 파싱을 안정화한다."]];
const quiz=document.querySelector('#quiz'),status=document.querySelector('#status'),result=document.querySelector('#result');let graded=false,day='all',wrong=false;
function draw(){quiz.innerHTML='';Q.forEach((q,i)=>{const saved=localStorage.getItem('ai40_set3_'+i);const el=document.createElement('article');el.className='q';el.dataset.day=q[0];el.dataset.i=i;el.innerHTML=`<div class="meta"><span class="tag">DAY ${q[0]}</span><span>${i+1}번</span></div><h2>${q[1]}</h2>${q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${saved==j?'checked':''}>${j+1}. ${o}</label>`).join('')}<div class="explain"><div class="answer">정답: ${q[3]+1}번</div>${q[4]}</div>`;quiz.append(el)});if(graded)mark();filter();count()}
function count(){const n=Q.filter((_,i)=>localStorage.getItem('ai40_set3_'+i)!==null).length;status.textContent=`${n} / 40 선택`}
function mark(){let score=0;document.querySelectorAll('.q').forEach(el=>{const i=+el.dataset.i,v=localStorage.getItem('ai40_set3_'+i);el.classList.add('graded');el.classList.remove('correct','wrong');if(v!==null&&+v===Q[i][3]){el.classList.add('correct');score++}else el.classList.add('wrong')});result.classList.add('show');result.textContent=`총점 ${score} / 40점 · 정답률 ${Math.round(score/40*100)}%`;localStorage.setItem('ai40_set3_score',score)}
function filter(){document.querySelectorAll('.q').forEach(el=>{const d=day==='all'||el.dataset.day===day;const w=!wrong||el.classList.contains('wrong');el.hidden=!(d&&w)})}
quiz.addEventListener('change',e=>{if(e.target.matches('input')){localStorage.setItem('ai40_set3_'+e.target.name.slice(1),e.target.value);count()}});document.querySelector('#filters').addEventListener('click',e=>{if(e.target.dataset.day){day=e.target.dataset.day;document.querySelectorAll('[data-day]').forEach(b=>b.classList.toggle('active',b===e.target));filter()}});document.querySelector('#wrongOnly').onclick=e=>{wrong=!wrong;e.target.classList.toggle('active',wrong);filter()};document.querySelector('#grade').onclick=()=>{graded=true;mark();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};document.querySelector('#reset').onclick=()=>{if(confirm('선택과 점수를 모두 초기화할까요?')){Object.keys(localStorage).filter(k=>k.startsWith('ai40_set3_')).forEach(k=>localStorage.removeItem(k));graded=false;result.classList.remove('show');draw()}};draw();
</script></body></html>
