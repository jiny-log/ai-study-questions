<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 딥러닝 개념 퀴즈 SET 3</title>
  <style>
    :root {
      --navy: #142c63;
      --blue: #315bd6;
      --sky: #eaf1ff;
      --ink: #19243a;
      --muted: #667085;
      --line: #dbe3f0;
      --paper: #ffffff;
      --bg: #f4f7fb;
      --correct: #18794e;
      --correct-bg: #eaf8f0;
      --wrong: #c4323f;
      --wrong-bg: #fff0f1;
      --shadow: 0 12px 34px rgba(20, 44, 99, 0.09);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 7% 0%, rgba(49, 91, 214, 0.11), transparent 25rem),
        var(--bg);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.6;
    }

    button, input { font: inherit; }

    .hero {
      color: #fff;
      background: linear-gradient(130deg, #102553, #315bd6 70%, #5a85ee);
      padding: 52px 20px 72px;
    }

    .hero-inner,
    .layout {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #cddaff;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 680px;
      margin: 16px 0 0;
      color: #e4ebff;
      font-size: 1.04rem;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .hero-stats span {
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .layout {
      position: relative;
      margin-top: -38px;
      padding-bottom: 72px;
    }

    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      padding: 16px;
      border: 1px solid rgba(219, 227, 240, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .progress-copy {
      min-width: 125px;
      font-weight: 800;
    }

    .progress-track {
      flex: 1;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf5;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #315bd6, #6d92ec);
      transition: width 180ms ease;
    }

    .jump-links {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .jump-links a {
      flex: 0 0 auto;
      padding: 7px 11px;
      color: var(--navy);
      border-radius: 10px;
      background: var(--sky);
      font-size: 0.84rem;
      font-weight: 800;
      text-decoration: none;
    }

    .quiz-section {
      scroll-margin-top: 145px;
      margin-top: 44px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .section-kicker {
      margin: 0;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    h2 {
      margin: 2px 0 0;
      color: var(--navy);
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -0.035em;
    }

    .section-score {
      margin: 0;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .question-card {
      margin-bottom: 16px;
      padding: clamp(20px, 4vw, 28px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 7px 22px rgba(20, 44, 99, 0.045);
      transition: border-color 180ms ease, transform 180ms ease;
    }

    .question-card:focus-within {
      border-color: #9ab3f4;
      transform: translateY(-1px);
    }

    .question-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 28px;
      margin-bottom: 9px;
      padding: 0 10px;
      color: var(--blue);
      border-radius: 999px;
      background: var(--sky);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .question-text {
      margin: 0 0 16px;
      font-size: 1.04rem;
      font-weight: 800;
      letter-spacing: -0.018em;
    }

    .options {
      display: grid;
      gap: 9px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .option:hover { background: #f8faff; }

    .option:has(input:checked) {
      border-color: #6f91e8;
      background: #edf3ff;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin: 3px 0 0;
      accent-color: var(--blue);
      flex: 0 0 auto;
    }

    .option.correct {
      color: #0f6540;
      border-color: #60b88c;
      background: var(--correct-bg);
    }

    .option.wrong {
      color: #9f202c;
      border-color: #e68d96;
      background: var(--wrong-bg);
    }

    .feedback {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      border-left: 4px solid var(--blue);
      border-radius: 0 10px 10px 0;
      background: #f5f8ff;
      font-size: 0.93rem;
    }

    .feedback.show { display: block; }

    .feedback strong { color: var(--navy); }

    .result-panel {
      display: none;
      margin-top: 40px;
      padding: clamp(24px, 5vw, 36px);
      color: #fff;
      border-radius: 22px;
      background: linear-gradient(135deg, #142c63, #315bd6);
      box-shadow: var(--shadow);
    }

    .result-panel.show { display: block; }

    .result-panel h2 { color: #fff; }

    .result-score {
      margin: 8px 0 0;
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .result-message {
      margin: 14px 0 0;
      color: #dce6ff;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .button {
      min-width: 150px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 900;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .button:hover { transform: translateY(-1px); filter: brightness(1.04); }

    .button.primary { color: #fff; background: var(--blue); }
    .button.secondary { color: var(--navy); background: #e8eefc; }

    .footer-note {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.84rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .hero { padding-top: 40px; }
      .layout { width: min(100% - 20px, 960px); }
      .toolbar { top: 7px; border-radius: 16px; }
      .toolbar-row { align-items: flex-start; flex-direction: column; gap: 8px; }
      .progress-track { width: 100%; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 4px; }
      .question-card { border-radius: 16px; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Deep Learning Study Quiz</p>
      <h1>이미지 딥러닝 개념 퀴즈 <small>SET 3</small></h1>
      <p class="subtitle">기존 문제와 겹치지 않는 SET 3입니다. 모델 구조와 학습 원리를 새로운 관점에서 확인해 보세요.</p>
      <div class="hero-stats" aria-label="퀴즈 정보">
        <span>총 30문제</span>
        <span>4지선다형</span>
        <span>문제당 1점</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <div class="toolbar" aria-label="풀이 현황">
      <div class="toolbar-row">
        <span class="progress-copy"><span id="answeredCount">0</span> / 30 응답</span>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
      <nav class="jump-links" aria-label="자료별 문제 바로가기">
        <a href="#section-cnn">5-1 CNN 모델</a>
        <a href="#section-sequence">5-2 RNN·ViT</a>
        <a href="#section-foundation">6 파운데이션 모델</a>
      </nav>
    </div>

    <form id="quizForm">
      <div id="quizRoot"></div>

      <section class="result-panel" id="resultPanel" aria-live="polite">
        <p class="eyebrow">Quiz Result</p>
        <h2>채점 결과</h2>
        <p class="result-score"><span id="totalScore">0</span> / 30</p>
        <p class="result-message" id="resultMessage"></p>
      </section>

      <div class="action-bar">
        <button class="button primary" type="submit">전체 채점하기</button>
        <button class="button secondary" type="button" id="showAnswersBtn">정답·해설 보기</button>
        <button class="button secondary" type="button" id="resetBtn">처음부터 다시 풀기</button>
      </div>
    </form>

    <p class="footer-note">자료: 5-1 이미지 딥러닝 모델 · 5-2 이미지 딥러닝 모델 · 6 이미지 파운데이션 모델</p>
  </main>

    const quizRoot = document.getElementById("quizRoot");
    const quizForm = document.getElementById("quizForm");
    const answeredCount = document.getElementById("answeredCount");
    const progressBar = document.getElementById("progressBar");
    const resultPanel = document.getElementById("resultPanel");
    const totalScore = document.getElementById("totalScore");
    const resultMessage = document.getElementById("resultMessage");
    const showAnswersBtn = document.getElementById("showAnswersBtn");
    const resetBtn = document.getElementById("resetBtn");
    const choiceMarks = ["①", "②", "③", "④"];
    const totalQuestions = sections.reduce((sum, section) => sum + section.questions.length, 0);

    function renderQuiz() {
      let globalIndex = 0;

      sections.forEach((section, sectionIndex) => {
        const sectionEl = document.createElement("section");
        sectionEl.className = "quiz-section";
        sectionEl.id = section.id;

        const head = document.createElement("div");
        head.className = "section-head";
        head.innerHTML = `
          <div>
            <p class="section-kicker">${section.kicker}</p>
            <h2>${section.title}</h2>
          </div>
          <p class="section-score" id="sectionScore-${sectionIndex}">10문제</p>
        `;
        sectionEl.appendChild(head);

        section.questions.forEach((question, localIndex) => {
          const questionIndex = globalIndex++;
          const card = document.createElement("article");
          card.className = "question-card";
          card.dataset.section = String(sectionIndex);
          card.dataset.answer = String(question.answer);
          card.innerHTML = `
            <span class="question-number">Q${localIndex + 1}</span>
            <p class="question-text">${question.q}</p>
            <div class="options"></div>
            <p class="feedback" id="feedback-${questionIndex}">
              <strong>정답 ${choiceMarks[question.answer]}</strong> ${question.options[question.answer]}<br>
              ${question.explanation}
            </p>
          `;

          const optionsEl = card.querySelector(".options");
          question.options.forEach((option, optionIndex) => {
            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = `question-${questionIndex}`;
            input.value = String(optionIndex);
            input.setAttribute("aria-describedby", `feedback-${questionIndex}`);

            const text = document.createElement("span");
            text.textContent = `${choiceMarks[optionIndex]} ${option}`;

            label.append(input, text);
            optionsEl.appendChild(label);
          });

          sectionEl.appendChild(card);
        });

        quizRoot.appendChild(sectionEl);
      });
    }

    function updateProgress() {
      const count = quizForm.querySelectorAll('input[type="radio"]:checked').length;
      answeredCount.textContent = String(count);
      progressBar.style.width = `${(count / totalQuestions) * 100}%`;
    }

    function clearEvaluation() {
      document.querySelectorAll(".option").forEach(option => option.classList.remove("correct", "wrong"));
      document.querySelectorAll(".feedback").forEach(feedback => feedback.classList.remove("show"));
      sections.forEach((section, index) => {
        document.getElementById(`sectionScore-${index}`).textContent = `${section.questions.length}문제`;
      });
      resultPanel.classList.remove("show");
    }

    function evaluateQuiz(showAllAnswers = false) {
      let score = 0;
      let unanswered = 0;
      const sectionScores = Array(sections.length).fill(0);

      document.querySelectorAll(".question-card").forEach(card => {
        const answer = Number(card.dataset.answer);
        const sectionIndex = Number(card.dataset.section);
        const selected = card.querySelector('input[type="radio"]:checked');
        const optionLabels = card.querySelectorAll(".option");
        const feedback = card.querySelector(".feedback");

        optionLabels.forEach(option => option.classList.remove("correct", "wrong"));
        optionLabels[answer].classList.add("correct");

        if (!selected) {
          unanswered += 1;
        } else if (Number(selected.value) === answer) {
          score += 1;
          sectionScores[sectionIndex] += 1;
        } else {
          selected.closest(".option").classList.add("wrong");
        }

        if (showAllAnswers || selected) feedback.classList.add("show");
      });

      sections.forEach((section, index) => {
        document.getElementById(`sectionScore-${index}`).textContent = `${sectionScores[index]} / ${section.questions.length}점`;
      });

      totalScore.textContent = String(score);
      const percentage = Math.round((score / totalQuestions) * 100);
      let message = "핵심 개념을 한 번 더 복습해 보세요.";
      if (percentage >= 90) message = "훌륭합니다! 세 자료의 핵심 개념을 정확하게 이해하고 있어요.";
      else if (percentage >= 70) message = "좋아요! 틀린 문제의 해설을 중심으로 조금만 더 복습해 보세요.";
      else if (percentage >= 50) message = "기본 흐름은 잡혔어요. 모델별 특징을 비교하며 복습하면 더 좋아집니다.";
      if (unanswered > 0) message += ` 미응답 ${unanswered}문제가 있습니다.`;
      resultMessage.textContent = message;
      resultPanel.classList.add("show");
      resultPanel.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    renderQuiz();

    quizForm.addEventListener("change", () => {
      updateProgress();
      if (resultPanel.classList.contains("show")) clearEvaluation();
    });

    quizForm.addEventListener("submit", event => {
      event.preventDefault();
      evaluateQuiz(false);
    });

    showAnswersBtn.addEventListener("click", () => evaluateQuiz(true));

    resetBtn.addEventListener("click", () => {
      quizForm.reset();
      clearEvaluation();
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
